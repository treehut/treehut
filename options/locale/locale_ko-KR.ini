[repo.permissions]
code.read = <b>읽기:</b> 저장소의 코드에 액세스하고 복제합니다.
code.write = <b>Write:</b> 저장소에 푸시하고 브랜치와 태그를 생성합니다.
issues.read = <b>읽기:</b> 이슈와 코멘트를 읽고 작성합니다.
issues.write = <b>쓰기:</b> 이슈를 종료하고 라벨, 마일스톤, 담당자, 마감일, 종속성과 같은 메타데이터를 관리합니다.
pulls.read = <b>읽기:</b> pull 요청을 읽고 생성합니다.
pulls.write = <b>쓰기:</b> pull 요청을 종료하고 라벨, 마일스톤, 담당자, 기한, 종속성과 같은 메타데이터를 관리합니다.
releases.read = <b>읽기:</b> 릴리스 보기 및 다운로드.
releases.write = <b>작성:</b> 릴리스와 해당 asset을 게시, 편집, 삭제합니다.
wiki.read = <b>읽기:</b> 통합 위키와 그 기록을 읽어보세요.
wiki.write = <b>쓰기:</b> 통합 위키에서 페이지를 생성, 업데이트 및 삭제합니다.
projects.read = <b>읽기:</b> 저장소 프로젝트 보드에 액세스하세요.
projects.write = <b>쓰기:</b> 프로젝트와 칼럼을 생성하고 편집하세요.
packages.read = <b>읽기:</b> 저장소에 할당된 패키지를 보고 다운로드합니다.
packages.write = <b>쓰기:</b> 저장소에 할당된 패키지를 게시하고 삭제합니다.
actions.read = <b>읽기:</b> 워크플로우 실행 및 해당 로그를 봅니다.
actions.write = <b>쓰기:</b> 워크플로우를 트리거하고, 다시 시작하고, 취소합니다. pull 요청 포스터에 대한 신뢰 위임을 관리합니다.
ext_issues = 외부 이슈 트래커 링크에 액세스하세요. 권한은 외부에서 관리됩니다.
ext_wiki = 외부 위키에 대한 링크에 액세스합니다. 권한은 외부에서 관리됩니다.

[translation_meta]
test = 이것은 테스트 문자열입니다. Forgejo UI에는 표시되지 않으며 테스트 목적으로 사용됩니다. 100% 완료 표시를 달성하기 위한 시간(또는 선택한 재미있는 사실)을 절약하려면 자유롭게 "ok"를 입력하세요 :)