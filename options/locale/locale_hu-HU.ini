[repo.permissions]
code.read =<b>Olvasás:</b> A tároló kódjának elérése és klónozása.
code.write =<b>Írás:</b> Feltöltés a tárolóba, valamint ágak és címkék létrehozása.
issues.read =<b>Olvasás:</b> Hibajegyek és hozzászólások olvasása és létrehozása.
issues.write =<b>Írás:</b> Hibajegyek lezárása, valamint a címkék, mérföldkövek, felelősök, határidők és függőségek kezelése.
pulls.read =<b>Olvasás:</b> Egyesítési kérések olvasása és létrehozása.
pulls.write =<b>Írás:</b> Egyesítési kérések lezárása, valamint a címkék, mérföldkövek, felelősök, határidők és függőségek kezelése.
releases.read =<b>Olvasás:</b> Kiadások megtekintése és letöltése.
releases.write =<b>Írás:</b> Kiadások és tartozékaik közzététele, szerkesztése és törlése.
wiki.read =<b>Olvasás:</b> A beépített wiki és előzményeinek olvasása.
wiki.write =<b>Írás:</b> Oldalak létrehozása, frissítése és törlése a beépített wikiben.
projects.read =<b>Olvasás:</b> Hozzáférés a tároló projekttábláihoz.
projects.write =<b>Írás:</b> Projektek és oszlopok létrehozása és szerkesztése.
packages.read =<b>Olvasás:</b> A tárolóhoz rendelt csomagok megtekintése és letöltése.
packages.write =<b>Írás:</b> A tárolóhoz rendelt csomagok közzététele és törlése.
actions.read =<b>Olvasás:</b> A beépített CI/CD-folyamatok és naplóik megtekintése.
actions.write =<b>Írás:</b> Függőben lévő CI/CD-folyamatok kézi indítása, újraindítása, megszakítása vagy jóváhagyása.
ext_issues =Hozzáférés a külső hibajegykezelő hivatkozásához. A jogosultságokat a külső rendszer kezeli.
ext_wiki =Hozzáférés a külső wiki hivatkozásához. A jogosultságokat a külső rendszer kezeli.

