reinstall_confirm_check_2 =Előfordulhat, hogy a tárolókat és a beállításokat újra kell szinkronizálni. A jelölőnégyzet bejelölésével megerősíti, hogy kézzel újraszinkronizálja a tárolók hookjait és az authorized_keys fájlt, valamint ellenőrzi a tárolók és tükrök beállításait.
reinstall_confirm_check_3 =Megerősíti, hogy teljesen biztos abban, hogy ez a Forgejo a megfelelő helyen található app.ini fájllal fut, és valóban szükséges az újratelepítés. Egyben tudomásul veszi a fenti kockázatokat.
