reinstall_confirm_message =A meglévő Forgejo-adatbázisba történő újratelepítés több problémát is okozhat. A legtöbb esetben a meglévő „app.ini” fájllal kell futtatnia a Forgejót. Ha biztosan tudja, mit tesz, erősítse meg a következőket:
