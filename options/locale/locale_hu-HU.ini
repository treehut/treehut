oauth2_application_create_description =Az OAuth2-alkalmazások hozzáférést biztosítanak külső alkalmazása számára a példány felhasználói fiókjaihoz.
oauth2_application_remove_description =Az OAuth2-alkalmazás eltávolítása megakadályozza, hogy hozzáférjen a példány engedélyezett felhasználói fiókjaihoz. Folytatja?
oauth2_application_locked =A Forgejo indításkor előre regisztrál bizonyos OAuth2-alkalmazásokat, ha azok be vannak kapcsolva a konfigurációban. A váratlan működés elkerülése érdekében ezek nem szerkeszthetők és nem távolíthatók el. További információért tekintse meg az OAuth2 dokumentációját.
authorized_oauth2_applications_description =Ezeknek a külső alkalmazásoknak hozzáférést adott személyes Forgejo-fiókjához. Vonja vissza a már nem használt alkalmazások hozzáférését.
revoke_oauth2_grant_description =A külső alkalmazás hozzáférésének visszavonásával az alkalmazás többé nem férhet hozzá adataihoz. Biztos benne?
revoke_oauth2_grant_success =A hozzáférés sikeresen visszavonva.
twofa_recovery_tip =Eszköze elvesztése esetén egyszer használatos helyreállítási kulccsal szerezheti vissza a hozzáférést fiókjához.
twofa_scratch_token_regenerated =Az új egyszer használatos helyreállítási kulcsa: %s. Tárolja biztonságos helyen, mert többé nem jelenik meg.
regenerate_scratch_token_desc =Ha elvesztette helyreállítási kulcsát, vagy már felhasználta a bejelentkezéshez, itt állíthatja vissza.
then_enter_passcode =Ezután adja meg az alkalmazásban megjelenő kódot:
twofa_enrolled =Fiókjában sikeresen bekapcsolta a kétlépcsős hitelesítést. Tárolja biztonságos helyen egyszer használatos helyreállítási kulcsát (%s), mert többé nem jelenik meg.
twofa_failed_get_secret =Nem sikerült lekérni a titkos kulcsot.
webauthn_desc =A biztonsági kulcsok kriptográfiai kulcsokat tartalmazó hardvereszközök. Kétlépcsős hitelesítéshez használhatók. A biztonsági kulcsoknak támogatniuk kell a <a rel="noreferrer" target="_blank" href="%s">WebAuthn Authenticator</a> szabványt.
